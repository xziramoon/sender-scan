                class="w-full pl-10 pr-12 py-3 bg-white border border-orange-100 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-orange-400 font-mono text-[14px]"
                autocomplete="off" onfocus="this.select()">

    <div id="camera-modal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
        <div class="absolute top-0 left-0 right-0 p-4 pt-safe-top z-20 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
            <span class="text-white font-bold text-sm bg-red-600 px-3 py-1.5 rounded-full border border-white/20 shadow-lg"><i class="fas fa-barcode mr-1"></i> เล็งบาร์โค้ดในกรอบแดง</span>
            <button onclick="stopCamera()" class="w-10 h-10 bg-white/20 rounded-full text-white text-xl flex items-center justify-center backdrop-blur-md">&times;</button>
        </div>
        <div class="flex-1 relative bg-black">
            <div id="reader" class="absolute inset-0"></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                <div class="w-72 h-32 border-2 border-white/20 rounded-xl relative overflow-hidden shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]">
                    <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-red-500 rounded-tl-xl"></div>
                    <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-red-500 rounded-tr-xl"></div>
                    <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-red-500 rounded-bl-xl"></div>
                    <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-red-500 rounded-br-xl"></div>
                    <div class="laser-line"></div>

            </div>
            <div id="zoom-control" class="hidden absolute bottom-8 left-1/2 -translate-x-1/2 z-20 items-center gap-3 bg-black/60 backdrop-blur-md rounded-full px-4 py-2.5" style="width:82%; max-width:340px;">
                <i class="fas fa-search-minus text-white text-xs"></i>
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" class="flex-1" oninput="onZoomChange(this.value)">
                <i class="fas fa-search-plus text-white text-xs"></i>
                <span id="zoom-value" class="text-white text-[11px] font-bold w-9 text-right">1.0x</span>
            </div>
        </div>
    </div>

    <script>
        const CACHE_BUSTER = "&t=" + new Date().getTime();
        const CLOUD_DB_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRUuWPCwpQbleOg8F8Kyt34obiUG15BuUuHJvRfo_I5GSqlCPp638EqDUgcqHG0igWkg9g6ko7h9hYS/pub?gid=2051624344&single=true&output=csv" + CACHE_BUSTER; 
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt'; 
        
        let masterDb = [];
        let globalUnits = ["ชิ้น", "แพ็ค", "ลัง", "กล่อง", "หีบ"];

        // ===== ระบบ Multi-User (สลับผู้ใช้เครื่องเดียวกัน) =====
        let users = [];          // [{ id, name, createdAt }]
        let activeUserId = null; // userId ที่กำลังใช้งานอยู่

        let currentItems = [];
        let currentBillId = "";
        let senderHistory = [];
        let pickerName = "";

        let client; let html5QrCode; let lastScanTime = 0;
        let pendingMsgId = null; let ackTimeout = null;
        let audioCtx = null;
        let dbLoaded = false; // true เมื่อโหลด CSV ฐานข้อมูลเสร็จ
        let userReady = false; // true เมื่อเลือก/สร้าง user เสร็จแล้ว

        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator(); 
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if(type === 'error') { 
                    osc.type = 'sawtooth'; osc.frequency.value = 150; 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    osc.start(); setTimeout(() => osc.stop(), 300); 
                } 
                else if (type === 'success') { 
                    osc.type = 'sine'; osc.frequency.value = 800; 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    osc.start(); setTimeout(() => osc.stop(), 100); 
                } 
                else if (type === 'warning') { 
                    osc.type = 'square'; osc.frequency.value = 400; 
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); setTimeout(() => osc.stop(), 150); 
                }
            } catch(e) {}
        }

        function getThaiDateTime() {
            const d = new Date(); const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
        }

        // ===== Multi-User: helper functions =====
        function generateUserId() {
            return 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }
        function getUsers() {
            return JSON.parse(localStorage.getItem('sm_users')) || [];
        }
        function saveUsers(list) {
            localStorage.setItem('sm_users', JSON.stringify(list));
        }
        function getActiveUserId() {
            return localStorage.getItem('sm_active_user') || null;
        }
        function setActiveUserId(id) {
            activeUserId = id;
            localStorage.setItem('sm_active_user', id);
        }
        // ใช้ครอบ key เดิมทุกตัวให้แยกตาม user เช่น userKey('current_items') = sm_{userId}_current_items
        function userKey(base) {
            return `sm_${activeUserId}_${base}`;
        }

        // ย้ายข้อมูลเก่า (ก่อนมีระบบ user) มาเป็นของ user คนแรกที่สร้าง เพื่อไม่ให้ข้อมูลเดิมหาย
        function migrateOldDataToUser(userId) {
            const oldItems = localStorage.getItem('sm_current_items');
            const oldBill = localStorage.getItem('sm_current_bill');
            const oldHistory = localStorage.getItem('sm_history_log');
            const oldPicker = localStorage.getItem('sm_picker_name');
            if (oldItems !== null) localStorage.setItem(`sm_${userId}_current_items`, oldItems);
            if (oldBill !== null) localStorage.setItem(`sm_${userId}_current_bill`, oldBill);
            if (oldHistory !== null) localStorage.setItem(`sm_${userId}_history_log`, oldHistory);
            if (oldPicker !== null) localStorage.setItem(`sm_${userId}_picker_name`, oldPicker);
        }

        // โหลดข้อมูล (บิลปัจจุบัน / ประวัติ / ชื่อผู้จัด) ของ user ที่ active อยู่ตอนนี้
        function loadUserData() {
            currentItems = JSON.parse(localStorage.getItem(userKey('current_items'))) || [];
            currentBillId = localStorage.getItem(userKey('current_bill')) || "";
            senderHistory = JSON.parse(localStorage.getItem(userKey('history_log'))) || [];
            const u = getUsers().find(x => x.id === activeUserId);
            pickerName = localStorage.getItem(userKey('picker_name')) || (u ? u.name : "");
            updateUserHeaderDisplay();
        }

        function updateUserHeaderDisplay() {
            const u = getUsers().find(x => x.id === activeUserId);
            const badge = document.getElementById('user-badge-name');
            if (badge) badge.innerText = u ? u.name : '-';
            const pickerEl = document.getElementById('picker-name-display');
            if (pickerEl) pickerEl.innerText = pickerName || "ยังไม่ระบุชื่อ";
        }

        // เด้งถามชื่อ user ใหม่ (ใช้ทั้งตอนสร้าง user แรกสุด และตอนกดเพิ่ม user)
        function promptCreateUser(isFirst) {
            return new Promise((resolve) => {
                function ask() {
                    Swal.fire({
                        title: isFirst ? 'ยินดีต้อนรับ! ตั้งชื่อผู้ใช้งานของคุณ' : 'เพิ่มผู้ใช้งานใหม่',
                        input: 'text',
                        inputPlaceholder: 'ตัวอย่าง: สมชาย',
                        allowOutsideClick: false, allowEscapeKey: false, showCancelButton: false,
                        confirmButtonColor: '#F97316', confirmButtonText: isFirst ? 'เริ่มใช้งาน' : 'สร้าง',
                        inputValidator: (value) => { if (!value || !value.trim()) return 'กรุณากรอกชื่อก่อนดำเนินการต่อ'; }
                    }).then((r) => {
                        if (r.isConfirmed) {
                            resolve({ id: generateUserId(), name: r.value.trim(), createdAt: Date.now() });
                        } else { ask(); }
                    });
                }
                ask();
            });
        }

        // เด้งให้เลือก user ที่มีอยู่แล้ว (ตอนเปิดแอปแต่ยังไม่มี active user)
        function promptSelectUser(userList) {
            return new Promise((resolve) => {
                window.__resolveUserSelect = resolve;
                let listHtml = '<div class="flex flex-col gap-2 mt-3 text-left max-h-[50vh] overflow-y-auto">';
                userList.forEach(u => {
                    listHtml += `<button onclick="window.__resolveUserSelect('${u.id}')" class="w-full flex items-center gap-2 border border-gray-200 bg-white rounded-xl p-3 hover:bg-orange-50 active:bg-orange-100 transition text-left">
                        <i class="fas fa-user-circle text-2xl text-orange-400"></i>
                        <div class="font-bold text-gray-800 text-sm">${u.name}</div>
                    </button>`;
                });
                listHtml += `</div>
                    <button onclick="window.__resolveUserSelect('__new__')" class="w-full mt-3 bg-orange-500 text-white py-2.5 rounded-lg font-bold shadow-sm"><i class="fas fa-user-plus mr-2"></i>เพิ่ม User ใหม่</button>`;
                Swal.fire({
                    title: '<i class="fas fa-user-check text-orange-500 mr-2"></i>เลือกผู้ใช้งาน',
                    html: listHtml, showConfirmButton: false, allowOutsideClick: false, allowEscapeKey: false
                });
            });
        }

        // ทำงานเมื่อเปิดแอปทุกครั้ง: เช็คว่ามี user หรือยัง / มี active user หรือยัง
        async function ensureActiveUser() {
            users = getUsers();
            let active = getActiveUserId();

            if (users.length === 0) {
                // ยังไม่เคยมี user เลย -> สร้าง user แรก + migrate ข้อมูลเก่า (ถ้ามี)
                const newUser = await promptCreateUser(true);
                users = [newUser];
                saveUsers(users);
                setActiveUserId(newUser.id);
                migrateOldDataToUser(newUser.id);
            } else if (!active || !users.find(u => u.id === active)) {
                // มี user อยู่แล้วแต่ยังไม่ได้เลือกใช้งาน -> ให้เลือก
                let chosen = await promptSelectUser(users);
                if (chosen === '__new__') {
                    const newUser = await promptCreateUser(false);
                    users.push(newUser); saveUsers(users);
                    chosen = newUser.id;
                }
                setActiveUserId(chosen);
            } else {
                activeUserId = active;
            }

            loadUserData();
            userReady = true;
            if (dbLoaded) finishBoot();
        }

        // เมนูสลับ / จัดการ user (เปิดจาก badge บน header)
        window.showUserMenu = function() {
            users = getUsers();
            let listHtml = '<div class="flex flex-col gap-2 mt-3 text-left max-h-[50vh] overflow-y-auto">';
            users.forEach(u => {
                const isActive = u.id === activeUserId;
                listHtml += `
                <div class="flex items-center justify-between border ${isActive ? 'border-orange-400 bg-orange-50' : 'border-gray-200 bg-white'} rounded-xl p-3">
                    <div class="flex items-center gap-2 flex-1 min-w-0 cursor-pointer" onclick="switchUser('${u.id}')">
                        <i class="fas fa-user-circle text-2xl ${isActive ? 'text-orange-500' : 'text-gray-300'}"></i>
                        <div class="min-w-0">
                            <div class="font-bold text-gray-800 text-sm truncate">${u.name}${isActive ? ' <span class="text-[10px] text-orange-600 font-bold">(ใช้งานอยู่)</span>' : ''}</div>
                        </div>
                    </div>
                    <button onclick="deleteUser('${u.id}', event)" class="text-red-400 hover:text-red-600 px-2"><i class="fas fa-trash-alt"></i></button>
                </div>`;
            });
            listHtml += `</div>
                <button onclick="Swal.close(); addNewUser();" class="w-full mt-3 bg-orange-500 text-white py-2.5 rounded-lg font-bold shadow-sm"><i class="fas fa-user-plus mr-2"></i>เพิ่ม User ใหม่</button>`;
            Swal.fire({
                title: '<i class="fas fa-users text-orange-500 mr-2"></i>สลับ / จัดการผู้ใช้งาน',
                html: listHtml, showConfirmButton: false, showCloseButton: true
            });
        }

        window.switchUser = function(id) {
            if (id === activeUserId) { Swal.close(); return; }
            Swal.close();
            setActiveUserId(id);
            loadUserData();
            updateUI();
            hideDropdown();
            Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'สลับผู้ใช้งานแล้ว', showConfirmButton: false, timer: 1200 });
        }

        window.addNewUser = function() {
            promptCreateUser(false).then((newUser) => {
                users = getUsers(); users.push(newUser); saveUsers(users);
                switchUser(newUser.id);
            });
        }

        window.deleteUser = function(id, event) {
            if (event) event.stopPropagation();
            users = getUsers();
            if (users.length <= 1) {
                Swal.fire({ toast: true, position: 'top', icon: 'warning', title: 'ต้องมีผู้ใช้งานอย่างน้อย 1 คน', showConfirmButton: false, timer: 1800 });
                return;
            }
            const u = users.find(x => x.id === id);
            Swal.fire({
                title: `ลบ "${u ? u.name : ''}" ?`, text: 'ข้อมูลบิลปัจจุบันและประวัติทั้งหมดของผู้ใช้งานนี้จะถูกลบถาวร', icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#EF4444', confirmButtonText: 'ลบถาวร', cancelButtonText: 'ยกเลิก'
            }).then((r) => {
                if (r.isConfirmed) {
                    localStorage.removeItem(`sm_${id}_current_items`);
                    localStorage.removeItem(`sm_${id}_current_bill`);
                    localStorage.removeItem(`sm_${id}_history_log`);
                    localStorage.removeItem(`sm_${id}_picker_name`);
                    users = users.filter(x => x.id !== id);
                    saveUsers(users);
                    if (activeUserId === id) {
                        localStorage.removeItem('sm_active_user');
                        activeUserId = users.length > 0 ? users[0].id : null;
                        if (activeUserId) { setActiveUserId(activeUserId); loadUserData(); updateUI(); }
                    }
                    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'ลบผู้ใช้งานแล้ว', showConfirmButton: false, timer: 1500 })
                        .then(() => { showUserMenu(); });
                }
            });
        }

        window.setPickerName = function() {
            Swal.fire({
                title: 'ชื่อพนักงานจัดของ', input: 'text', inputValue: pickerName, inputPlaceholder: 'ตัวอย่าง: สมชาย', showCancelButton: true, confirmButtonColor: '#F97316', confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    pickerName = result.value.trim() || "ไม่ระบุชื่อ";
                    localStorage.setItem(userKey('picker_name'), pickerName);
                    document.getElementById('picker-name-display').innerText = pickerName;
                }
            });
        }

        ensureActiveUser();

        Papa.parse(CLOUD_DB_URL, {
            download: true, header: true, skipEmptyLines: true,
            transformHeader: function(h) { return h.trim().replace(/^[\u200B\u200C\u200D\u200E\u200F\uFEFF]/,""); },
            complete: function(results) { 
                masterDb = results.data.map(row => {
                    let barcode = String(row['บาร์โค้ด'] || row['Barcode'] || row['barcode'] || row['รหัสแท่ง'] || row['รหัสสินค้า'] || row[Object.keys(row)[0]] || "").trim();
                    let name = String(row['ชื่อสินค้า'] || row['รายละเอียด'] || row['ชื่อ'] || row['สินค้า'] || row['รายการ'] || row['Name'] || row['Description'] || row['Item'] || row[Object.keys(row)[1]] || "ไม่มีชื่อสินค้า").trim();
                    let unit = String(row['หน่วยนับ'] || row['หน่วย'] || row['Unit'] || "ชิ้น").trim();
                    let posCode = String(row['รหัสสินค้า'] || row['posCode'] || row['Code'] || row['SKU'] || row['รหัส'] || barcode).trim();
                    return { 
                        Barcode: barcode, Name: name, Unit: unit, posCode: posCode,
                        _search_bc: barcode.toLowerCase(), _search_pc: posCode.toLowerCase(), _search_name: name.toLowerCase()
                    };
                });
                dbLoaded = true;
                if (userReady) finishBoot();
            },
            error: function() {
                document.getElementById('db-status-text').innerText = "โหลดข้อมูลล้มเหลว กรุณารีเฟรชแอปใหม่";
                document.getElementById('db-status-text').classList.add('text-red-500');
            }
        });

        // เรียกเมื่อทั้งฐานข้อมูลสินค้า (CSV) โหลดเสร็จ และเลือก/สร้าง user เสร็จแล้วทั้งคู่
        function finishBoot() {
            document.getElementById('loader-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loader-screen').style.display = 'none', 500);
            updateUserHeaderDisplay();
            if (!currentBillId) createNewBill(true); else updateUI();
            connectMQTT();
        }

        function saveLocalData() {
            localStorage.setItem(userKey('current_items'), JSON.stringify(currentItems));
            localStorage.setItem(userKey('current_bill'), currentBillId);
            updateUI();
        }

        const searchInput = document.getElementById('manual-input');
        const clearBtn = document.getElementById('clear-input-btn');
        const searchDropdown = document.getElementById('search-dropdown');

        function hideDropdown() {
            searchDropdown.classList.add('hidden');
            searchDropdown.innerHTML = '';
        }

        function showDropdownResults(matches) {
            if (!matches || matches.length === 0) { hideDropdown(); return; }
            window.tempSearchResults = matches;
            const SHOW_LIMIT = 40;
            const shown = matches.slice(0, SHOW_LIMIT);
            let headerText = `พบ ${matches.length} รายการ — แตะเพื่อเลือก`;
            if (matches.length > SHOW_LIMIT) headerText = `พบ ${matches.length} รายการ (แสดง ${SHOW_LIMIT} รายการแรก พิมพ์เพิ่มเพื่อค้นหาให้แคบลง)`;
            let html = `<div class="dropdown-header"><i class="fas fa-list mr-1"></i>${headerText}</div>`;
            shown.forEach((m, idx) => {
                html += `<div class="dropdown-item" ontouchstart="this.style.background='#fff7ed'" ontouchend="this.style.background=''" onclick="selectDropdownResult(${idx})">
                    <div style="flex:1;min-width:0">
                        <div class="dropdown-item-name">${m.Name}</div>
                        <div class="dropdown-item-sub">${m.Barcode || m.posCode}</div>
                    </div>
                    <div class="dropdown-item-unit">${m.Unit}</div>
                </div>`;
            });
            searchDropdown.innerHTML = html;
            searchDropdown.classList.remove('hidden');
        }

        window.selectDropdownResult = function(index) {
            if (window.tempSearchResults && window.tempSearchResults[index]) {
                let item = window.tempSearchResults[index];
                searchInput.value = item.Name;
                clearBtn.style.display = 'block';
                hideDropdown();
                setTimeout(() => processScannedItem(item), 50);
            }
        };

        let searchDebounceTimer = null;
        searchInput.addEventListener('input', function() {
            clearBtn.style.display = this.value.length > 0 ? 'block' : 'none';
            const val = this.value.trim();
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            if (val.length < 2) { hideDropdown(); return; }

            // debounce the expensive DB scan so fast typing / barcode-gun input doesn't
            // filter masterDb on every single keystroke (that's what caused the jank)
            searchDebounceTimer = setTimeout(() => runSearchFilter(val), 120);
        });

        function runSearchFilter(val) {
            // exact barcode/pos match → don't show dropdown (scanner will hit Enter)
            const cleanVal = val.toLowerCase();
            const exact = masterDb.find(i => i._search_bc === cleanVal || i._search_pc === cleanVal);
            if (exact) { hideDropdown(); return; }

            const matches = masterDb.filter(i =>
                i._search_bc.includes(cleanVal) ||
                i._search_name.includes(cleanVal) ||
                i._search_pc.includes(cleanVal)
            );
            showDropdownResults(matches);
        }

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                let val = this.value.trim();
                if (!val) return;
                // If dropdown open → select first result
                if (!searchDropdown.classList.contains('hidden') && window.tempSearchResults && window.tempSearchResults.length > 0) {
                    selectDropdownResult(0);
                    return;
                }
                // Otherwise exact/barcode search
                searchItem(val);
            }
            if (e.key === 'Escape') { hideDropdown(); }
        });

        // Close dropdown on outside click/touch
        document.addEventListener('click', function(e) {
            if (!searchDropdown.contains(e.target) && e.target !== searchInput) hideDropdown();
        });

        window.clearSearchInput = function() {
            searchInput.value = ''; clearBtn.style.display = 'none'; hideDropdown(); searchInput.focus(); 
        };

        function searchItem(query) {
            let cleanQuery = String(query).toLowerCase().trim();
            if(!cleanQuery) return;

            let exactMatch = masterDb.find(i => i._search_bc === cleanQuery || i._search_pc === cleanQuery); 
            if (exactMatch) { hideDropdown(); processScannedItem(exactMatch); return; }
            
            let matches = masterDb.filter(i => i._search_bc.includes(cleanQuery) || i._search_name.includes(cleanQuery) || i._search_pc.includes(cleanQuery));
            
            if (matches.length === 0) { 
                playSound('error'); 
                Swal.fire({ toast: true, position: 'top', icon: 'error', title: 'ไม่พบสินค้า', showConfirmButton: false, timer: 1500 }); 
                searchInput.focus(); searchInput.select();
            } else if (matches.length === 1) { 
                hideDropdown();
                processScannedItem(matches[0]); 
            } else {
                playSound('warning');
                showDropdownResults(matches);
                searchInput.focus();
            }
        }

        function processBarcode(barcode) {
            let cleanBarcode = String(barcode).toLowerCase().trim();
            let itemDb = masterDb.find(m => m._search_bc === cleanBarcode || m._search_pc === cleanBarcode);
            if (itemDb) { processScannedItem(itemDb, true); } else {
                const isCam = !document.getElementById('camera-modal').classList.contains('hidden');
                if(isCam) html5QrCode.pause(); 
                playSound('error'); 
                Swal.fire({ icon: 'error', title: 'ไม่พบในระบบ', text: `บาร์โค้ด: ${barcode}` }).then(() => { if(isCam) html5QrCode.resume(); });
            }
        }

        // 🟢 ฟังก์ชันหลักที่เด้งหน้าต่าง "ระบุยอด" กลับมาแล้ว
        function showQuantityPopup(dbItem, posCode, startVal, curUnit, existingIdx, isCam) {
            let baseUnit = curUnit || dbItem.Unit || "ชิ้น";
            let specificUnits = [...new Set(masterDb.filter(db => db.Name.trim().toLowerCase() === dbItem.Name.trim().toLowerCase() && db.Unit).map(db => db.Unit))];
            if(specificUnits.length === 0) specificUnits = [baseUnit, ...globalUnits];

            let unitHtml = '<div class="mt-4 mb-2 text-sm font-bold text-gray-500 text-left">เลือกหน่วยนับ:</div>';
            unitHtml += '<div class="flex overflow-x-auto pb-2 gap-2 hide-scrollbar" style="-webkit-overflow-scrolling: touch; width: 100%;">';
            specificUnits.forEach(u => { 
                let active = u === baseUnit ? "active" : ""; 
                unitHtml += `<button class="swal-unit-btn ${active}" onclick="changeUnitTemp('${u}')">${u}</button>`; 
            });
            unitHtml += '</div>';
            window.tempSelectedUnit = baseUnit;

            Swal.fire({
                title: 'ระบุยอดเบิก', 
                html: `<div class="font-bold text-gray-800 text-[15px] mb-1 leading-snug">${dbItem.Name}</div>
                       <div class="text-[10px] text-gray-500 mb-3">รหัส POS: ${posCode}</div>
                       <input type="number" id="quick-qty" class="swal-custom-input" value="${startVal}" min="1">
                       ${unitHtml}`,
                showCancelButton: true, confirmButtonColor: '#F97316', confirmButtonText: 'บันทึกยอด', cancelButtonText: 'ยกเลิก',
                didOpen: () => { 
                    setTimeout(() => { const inp = document.getElementById('quick-qty'); if(inp){ inp.focus(); inp.select(); } }, 100); 
                }
            }).then(r => { 
                if(r.isConfirmed) { 
                    let finalVal = parseInt(document.getElementById('quick-qty').value) || 1;
                    let finalBarcode = dbItem.Barcode; let finalPosCode = posCode;
                    if(window.tempSelectedUnit !== dbItem.Unit) {
                        let match = masterDb.find(db => db.Name.trim().toLowerCase() === dbItem.Name.trim().toLowerCase() && db.Unit === window.tempSelectedUnit);
                        if(match) { finalBarcode = match.Barcode; finalPosCode = match.posCode || match.Barcode; }
                    }

                    if(existingIdx > -1) {
                        currentItems[existingIdx].reqQty = finalVal; currentItems[existingIdx].unit = window.tempSelectedUnit;
                        currentItems[existingIdx].barcode = finalBarcode; currentItems[existingIdx].posCode = finalPosCode;
                    } else {
                        currentItems.unshift({ barcode: finalBarcode, original_barcode: dbItem.Barcode, name: dbItem.Name, unit: window.tempSelectedUnit, reqQty: finalVal, posCode: finalPosCode });
                    }
                    saveLocalData(); 
                    flashCard(existingIdx > -1 ? existingIdx : 0);
                }
                
                hideDropdown();
                setTimeout(() => { searchInput.focus(); searchInput.select(); }, 150);
                if(isCam) html5QrCode.resume();
            });
        }

        function processScannedItem(dbItem, fromScanner = false) {
            const isCam = !document.getElementById('camera-modal').classList.contains('hidden'); 
            if(isCam) html5QrCode.pause(); 
            hideDropdown();
            
            let posCode = dbItem.posCode || dbItem.Barcode; 
            // ตรวจสอบซ้ำ: เช็คทั้ง posCode และชื่อสินค้า เพื่อกันกรณีสินค้าเดียวกันมีหลาย barcode
            let existingIdx = currentItems.findIndex(i => 
                i.posCode === posCode || 
                i.name.trim().toLowerCase() === dbItem.Name.trim().toLowerCase()
            );
            
            if (existingIdx > -1) {
                playSound('warning');
                Swal.fire({
                    title: 'รายการซ้ำ!', html: `คุณสแกน <b>${dbItem.Name}</b> ไปแล้ว<br>ยอดเดิมในกล่องคือ: <b class="text-orange-600 text-lg">${currentItems[existingIdx].reqQty}</b> ${currentItems[existingIdx].unit}<br>ต้องการบวกเพิ่มใช่หรือไม่?`,
                    icon: 'warning', showCancelButton: true, confirmButtonColor: '#F97316', confirmButtonText: 'ใช่, แก้ไขยอด', cancelButtonText: 'ยกเลิก'
                }).then((r) => { 
                    if(r.isConfirmed) { 
                        setTimeout(() => { showQuantityPopup(dbItem, posCode, currentItems[existingIdx].reqQty + 1, currentItems[existingIdx].unit, existingIdx, isCam); }, 250);
                    } else { 
                        if(isCam) html5QrCode.resume(); 
                        setTimeout(() => { searchInput.focus(); searchInput.select(); }, 100);
                    } 
                });
            } else { 
                playSound('success'); 
                showQuantityPopup(dbItem, posCode, 1, dbItem.Unit || "ชิ้น", -1, isCam); 
            }
        }

        function flashCard(idx) {
            setTimeout(() => { const card = document.getElementById(`scard-${idx}`); if(card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.classList.add('row-highlight'); setTimeout(() => card.classList.remove('row-highlight'), 800); } }, 50);
        }

        window.updateQty = function(idx, delta, event) {
            if(event) event.stopPropagation();
            initAudio();
            let newQty = currentItems[idx].reqQty + delta;
            if (newQty <= 0) {
                Swal.fire({
                    title: 'ลบรายการ?', text: `ต้องการเอา ${currentItems[idx].name} ออกจากกล่อง?`, icon: 'warning',
                    showCancelButton: true, confirmButtonColor: '#EF4444', confirmButtonText: 'ลบทิ้ง', cancelButtonText: 'ยกเลิก'
                }).then((r) => { if (r.isConfirmed) { currentItems.splice(idx, 1); saveLocalData(); playSound('error'); } });
            } else {
                // patch just this card's number instead of re-rendering the whole list on every tap
                currentItems[idx].reqQty = newQty;
                localStorage.setItem(userKey('current_items'), JSON.stringify(currentItems));
                const qtyEl = document.getElementById(`qty-${idx}`);
                if (qtyEl) qtyEl.innerText = newQty; else updateUI();
                playSound('success');
            }
        }

        window.changeUnitTemp = function(newUnit) {
            window.tempSelectedUnit = newUnit;
            document.querySelectorAll('.swal-unit-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        window.editItem = function(idx) {
            let startVal = currentItems[idx].reqQty; let curUnit = currentItems[idx].unit;
            let specificUnits = [...new Set(masterDb.filter(db => db.Name.trim().toLowerCase() === currentItems[idx].name.trim().toLowerCase() && db.Unit).map(db => db.Unit))];
            if(specificUnits.length === 0) specificUnits = [curUnit, ...globalUnits];

            let unitHtml = '<div class="mt-4 mb-2 text-sm font-bold text-gray-500 text-left">เลือกหน่วยนับ:</div><div class="flex overflow-x-auto pb-2 gap-2 hide-scrollbar" style="-webkit-overflow-scrolling: touch; width: 100%;">';
            specificUnits.forEach(u => { let active = u === curUnit ? "active" : ""; unitHtml += `<button class="swal-unit-btn ${active}" onclick="changeUnitTemp('${u}')">${u}</button>`; });
            unitHtml += '</div>'; window.tempSelectedUnit = curUnit;

            Swal.fire({
                title: 'แก้ไขรายการ', html: `<div class="font-bold text-gray-800 text-[15px] mb-3 leading-snug">${currentItems[idx].name}</div><input type="number" id="quick-qty" class="swal-custom-input" value="${startVal}" min="1">${unitHtml}`,
                showCancelButton: true, showDenyButton: true, confirmButtonColor: '#F97316', denyButtonColor: '#EF4444', confirmButtonText: 'บันทึก', denyButtonText: 'ลบทิ้ง', cancelButtonText: 'ยกเลิก',
                didOpen: () => { setTimeout(() => { const inp = document.getElementById('quick-qty'); if(inp){ inp.focus(); inp.select(); } }, 100); }
            }).then(r => { 
                if(r.isConfirmed) { 
                    currentItems[idx].reqQty = parseInt(document.getElementById('quick-qty').value) || 1; 
                    if(window.tempSelectedUnit !== currentItems[idx].unit) {
                        let match = masterDb.find(db => db.Name.trim().toLowerCase() === currentItems[idx].name.trim().toLowerCase() && db.Unit === window.tempSelectedUnit);
                        if(match) { currentItems[idx].barcode = match.Barcode; currentItems[idx].posCode = match.posCode || match.Barcode; }
                    }
                    currentItems[idx].unit = window.tempSelectedUnit; saveLocalData(); 
                } else if(r.isDenied) { currentItems.splice(idx, 1); saveLocalData(); }
                hideDropdown();
                setTimeout(() => { searchInput.focus(); searchInput.select(); }, 150);
            });
        }

        function updateUI() {
            document.getElementById('bill-id-display').innerText = currentBillId;
            document.getElementById('item-count').innerText = currentItems.length;
            const btnSubmit = document.getElementById('btn-submit');
            if(currentItems.length > 0) {
                btnSubmit.disabled = false; btnSubmit.className = "flex-1 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-3.5 rounded-xl ml-2 shadow-[0_0_15px_rgba(249,115,22,0.5)] flex justify-center items-center text-[15px] animate-pulse"; btnSubmit.innerHTML = `<i class="fas fa-desktop mr-2 text-xl"></i> ส่งเข้าคอม (วงเวียน)`;
            } else {
                btnSubmit.disabled = true; btnSubmit.className = "flex-1 bg-gray-200 text-gray-400 font-bold py-3.5 rounded-xl ml-2 flex justify-center items-center text-[15px] transition-all"; btnSubmit.innerHTML = `สแกนสินค้าเพื่อเริ่ม`;
            }
            const container = document.getElementById('items-list');
            if (currentItems.length === 0) { container.innerHTML = `<div class="text-center text-gray-400 mt-20"><i class="fas fa-box-open text-5xl mb-4 opacity-20"></i><p class="font-bold">ยังไม่มีสินค้าในกล่อง</p></div>`; return; }
            let htmlContent = "";
            currentItems.forEach((i, idx) => {
                htmlContent += `
                <div id="scard-${idx}" class="item-card flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-2 cursor-pointer" onclick="editItem(${idx})">
                            <div class="font-bold text-gray-800 text-[15px] leading-tight mb-1">${i.name}</div>
                            <div class="text-[11px] font-mono text-gray-400">POS: ${i.posCode}</div>
                        </div>
                        <div class="text-[10px] font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded cursor-pointer border border-gray-200" onclick="editItem(${idx})">${i.unit}</div>
                    </div>
                    <div class="flex justify-between items-center border-t border-gray-50 pt-2 mt-1">
                        <div class="text-xs text-orange-400 font-bold">จำนวน:</div>
                        <div class="flex items-center gap-1 bg-orange-50 rounded-lg p-1 border border-orange-100">
                            <button onclick="updateQty(${idx}, -1, event)" class="w-10 h-8 flex items-center justify-center bg-white rounded text-orange-600 shadow-sm active:bg-orange-200 transition"><i class="fas fa-minus"></i></button>
                            <div id="qty-${idx}" class="w-12 text-center font-bold text-xl text-orange-700 cursor-pointer" onclick="editItem(${idx})">${i.reqQty}</div>
                            <button onclick="updateQty(${idx}, 1, event)" class="w-10 h-8 flex items-center justify-center bg-orange-500 rounded text-white shadow-sm active:bg-orange-600 transition"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>`;
            }); container.innerHTML = htmlContent;
        }

        window.showManageMenu = function() {
            Swal.fire({
                title: 'จัดการข้อมูลบิล',
                html: `<div class="flex flex-col gap-3 mt-4">
                        <button onclick="Swal.close(); exportToFile()" class="w-full bg-blue-50 border border-blue-200 text-blue-700 py-3 rounded-lg font-bold shadow-sm flex items-center justify-center"><i class="fas fa-save mr-2 text-xl"></i> เซฟบิลลงเครื่อง (Backup)</button>
                        <button onclick="Swal.close(); document.getElementById('file-loader').click()" class="w-full bg-purple-50 border border-purple-200 text-purple-700 py-3 rounded-lg font-bold shadow-sm flex items-center justify-center"><i class="fas fa-folder-open mr-2 text-xl"></i> โหลดบิลจากไฟล์ (Restore)</button>
                        <hr class="my-2 border-gray-200">
                        <button onclick="Swal.close(); confirmNewBill()" class="w-full bg-red-50 border border-red-200 text-red-600 py-3 rounded-lg font-bold shadow-sm flex items-center justify-center"><i class="fas fa-trash-alt mr-2 text-xl"></i> ลบทิ้ง / เริ่มบิลใหม่</button>
                    </div>`,
                showConfirmButton: false, showCloseButton: true
            });
        }
        window.exportToFile = function() {
            if(currentItems.length === 0) return Swal.fire({toast:true, position:'top', icon:'warning', title:'บิลว่างเปล่า', showConfirmButton:false, timer:1500});
            const dataObj = { billId: currentBillId, picker: pickerName, timestamp: getThaiDateTime(), items: currentItems };
            const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Mobile_Backup_${currentBillId}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
            Swal.fire({toast:true, position:'top', icon:'success', title:'เซฟไฟล์สำเร็จ!', showConfirmButton:false, timer:1500});
        }
        window.importFromFile = function(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.items && Array.isArray(data.items)) {
                        currentItems = data.items; currentBillId = data.billId || `REQ-${Date.now().toString().slice(-6)}`;
                        if(data.picker) { pickerName = data.picker; localStorage.setItem(userKey('picker_name'), pickerName); document.getElementById('picker-name-display').innerText = pickerName; }
                        saveLocalData(); Swal.fire({toast:true, position:'top', icon:'success', title:`โหลดบิลสำเร็จ (${data.items.length} รายการ)`, showConfirmButton:false, timer:2000});
                    }
                } catch (err) { Swal.fire('ข้อผิดพลาด', 'ไฟล์ไม่ถูกต้อง หรือเสียหาย', 'error'); }
                event.target.value = ''; 
            }; reader.readAsText(file);
        }
        function createNewBill(silent = false) {
            currentBillId = `REQ-${Date.now().toString().slice(-6)}`; currentItems = []; saveLocalData();
            if(!silent) Swal.fire({toast:true, position:'top', icon:'success', title:'เปิดบิลใหม่แล้ว', showConfirmButton:false, timer:1000});
        }
        function confirmNewBill() {
            if(currentItems.length > 0) { Swal.fire({ title: 'ทิ้งบิลเดิม?', text: 'รายการจะหายไป ยืนยันสร้างใหม่หรือไม่?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#EF4444', confirmButtonText: 'ลบและสร้างใหม่' }).then((r) => { if(r.isConfirmed) createNewBill(); }); } else { createNewBill(); }
        }
        function connectMQTT() {
            document.getElementById('mqtt-status').innerHTML = '<i class="fas fa-spinner fa-spin mr-1 text-yellow-300"></i>กำลังต่อ...';
            if(client) client.end(); 
            const clientId = 'smobile_' + Math.random().toString(16).substr(2, 8);
            client = mqtt.connect(MQTT_BROKER, { clientId: clientId, keepalive: 60, reconnectPeriod: 5000 });
            client.on('connect', () => { document.getElementById('mqtt-status').innerHTML = '<i class="fas fa-circle mr-1 text-green-400"></i>ออนไลน์'; client.subscribe('wangwian-hub-ack'); });
            client.on('message', (topic, message) => {
                if (topic === 'wangwian-hub-ack') {
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.msgId === pendingMsgId) {
                            clearTimeout(ackTimeout); pendingMsgId = null; Swal.close();
                            senderHistory.unshift({ billId: currentBillId, picker: pickerName, timestamp: getThaiDateTime(), items: JSON.parse(JSON.stringify(currentItems)) });
                            if(senderHistory.length > 50) senderHistory.pop(); localStorage.setItem(userKey('history_log'), JSON.stringify(senderHistory));
                            Swal.fire({ icon: 'success', title: 'ส่งสำเร็จ 100%!', text: 'คอมพิวเตอร์ยืนยันการรับข้อมูลแล้ว', timer: 2500, showConfirmButton: false }); createNewBill(true); 
                        }
                    } catch(e) {}
                }
            });
        }
        let currentZoomFeature = null;

        function startCamera() {
            document.getElementById('camera-modal').classList.remove('hidden');
            document.getElementById('zoom-control').classList.add('hidden');
            currentZoomFeature = null;
            setTimeout(() => {
                if (html5QrCode) { try { if(html5QrCode.isScanning) { html5QrCode.stop().then(() => html5QrCode.clear()); } else { html5QrCode.clear(); } } catch(e) {} }
                html5QrCode = new Html5Qrcode("reader");
                const formatsToSupport = [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A ];
                html5QrCode.start( { facingMode: "environment" }, {
                        fps: 10,
                        qrbox: { width: 280, height: 150 },
                        disableFlip: true,
                        formatsToSupport: formatsToSupport,
                        videoConstraints: {
                            facingMode: "environment",
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    },
                    (decodedText) => { const now = Date.now(); if(now - lastScanTime < 1000) return; lastScanTime = now; if(navigator.vibrate) navigator.vibrate(50); processBarcode(decodedText); }, (err) => { }
                ).then(() => { setupZoomControl(); }
                ).catch(err => { stopCamera(); Swal.fire('เปิดกล้องไม่ได้', 'กรุณาอนุญาตสิทธิ์การเข้าถึงกล้องให้เบราว์เซอร์\n\n' + err, 'error'); });
            }, 200);
        }

        function setupZoomControl() {
            const zoomControl = document.getElementById('zoom-control');
            try {
                const zoomFeature = html5QrCode.getRunningTrackCameraCapabilities().zoomFeature();
                if (zoomFeature && zoomFeature.isSupported()) {
                    const slider = document.getElementById('zoom-slider');
                    slider.min = zoomFeature.min();
                    slider.max = zoomFeature.max();
                    slider.step = zoomFeature.step() || 0.1;
                    slider.value = zoomFeature.value() || zoomFeature.min();
                    document.getElementById('zoom-value').innerText = parseFloat(slider.value).toFixed(1) + 'x';
                    currentZoomFeature = zoomFeature;
                    zoomControl.classList.remove('hidden');
                    return;
                }
            } catch(e) {}
            currentZoomFeature = null;
            zoomControl.classList.add('hidden');
        }

        window.onZoomChange = function(value) {
            if (currentZoomFeature) currentZoomFeature.apply(parseFloat(value));
            document.getElementById('zoom-value').innerText = parseFloat(value).toFixed(1) + 'x';
        }

        function stopCamera() {
            document.getElementById('zoom-control').classList.add('hidden');
            currentZoomFeature = null;
            if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(() => { html5QrCode.clear(); document.getElementById('camera-modal').classList.add('hidden'); }).catch(e => { document.getElementById('camera-modal').classList.add('hidden'); });
            } else { document.getElementById('camera-modal').classList.add('hidden'); }
        }
        window.submitBillToHub = function() {
            if(!pickerName) { return Swal.fire('ลืมใส่ชื่อ!', 'กรุณากดที่ช่อง "ผู้จัด: ยังไม่ระบุชื่อ" ด้านบนเพื่อระบุชื่อพนักงานก่อนส่งครับ', 'error'); }
            if(!client || !client.connected) return Swal.fire('ออฟไลน์!', 'รอระบบเชื่อมต่ออินเทอร์เน็ต (สถานะสีเขียว) ก่อนกดส่ง', 'warning');
            if(currentItems.length === 0) return;

            Swal.fire({
                title: 'ส่งเข้าหน้าจอคอม?', text: `ส่งข้อมูลกล่อง ${currentBillId} (${currentItems.length} รายการ)`, icon: 'question',
                showCancelButton: true, confirmButtonColor: '#F97316', confirmButtonText: 'ส่งข้อมูลเลย!'
            }).then((result) => {
                if (result.isConfirmed) {
                    pendingMsgId = 'MSG-' + Date.now();
                    const payload = { msgId: pendingMsgId, billId: currentBillId, picker: pickerName, items: currentItems, userId: activeUserId };
                    client.publish("wangwian-mobile-to-hub", JSON.stringify(payload), { qos: 1 });
                    Swal.fire({ title: 'กำลังส่งข้อมูล...', html: 'โปรดรอคอมพิวเตอร์ยืนยันการรับข้อมูล<br><br><i class="fas fa-spinner fa-spin text-3xl text-orange-500"></i>', allowOutsideClick: false, showConfirmButton: false });
                    ackTimeout = setTimeout(() => { pendingMsgId = null; Swal.fire({ icon: 'error', title: 'ส่งไม่สำเร็จ!', text: 'คอมพิวเตอร์หน้าจอวงเวียนไม่ตอบสนอง กรุณาตรวจสอบว่าคอมพิวเตอร์เปิดแอปและต่อเน็ตอยู่หรือไม่ (ข้อมูลในมือถือยังอยู่ครบ)', confirmButtonColor: '#EF4444' }); }, 7000);
                }
            });
        }
        window.loadHistoryBill = function(index) {
            Swal.close(); const log = senderHistory[index];
            const loadData = () => {
                currentItems = JSON.parse(JSON.stringify(log.items)); currentBillId = log.billId;
                if(log.picker) { pickerName = log.picker; localStorage.setItem(userKey('picker_name'), pickerName); document.getElementById('picker-name-display').innerText = pickerName; }
                saveLocalData(); Swal.fire({toast:true, position:'top', icon:'success', title:'ดึงประวัติสำเร็จ!', showConfirmButton:false, timer:1500});
            };
            if(currentItems.length > 0) { Swal.fire({ title: 'มีรายการค้างอยู่บนจอ', text: 'ต้องการทิ้งรายการปัจจุบันเพื่อเปิดดูบิลประวัติหรือไม่?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#F97316', confirmButtonText: 'ทิ้งและเปิดดู', cancelButtonText: 'ยกเลิก' }).then((r) => { if(r.isConfirmed) loadData(); }); } else { loadData(); }
        }
        window.showHistory = function() {
            if(senderHistory.length === 0) return Swal.fire({toast:true, position:'top', icon:'info', title:'ไม่มีประวัติ', showConfirmButton:false, timer:1500});
            let html = '<div class="text-left font-sarabun max-h-[60vh] overflow-y-auto pb-4">';
            senderHistory.forEach((log, index) => {
                html += `<div class="border border-gray-200 rounded-xl p-3 mb-2 bg-white shadow-sm flex justify-between items-center">
                            <div><div class="font-bold text-gray-800 text-sm leading-tight">${log.billId}</div><div class="text-[10px] text-gray-500 mt-1"><i class="far fa-user mr-1 text-orange-400"></i>${log.picker || "ไม่ระบุชื่อ"}</div><div class="text-[10px] text-gray-400 mt-0.5"><i class="far fa-clock mr-1"></i>${log.timestamp}</div></div>
                            <div class="flex flex-col gap-2 text-right items-end"><div class="bg-orange-50 text-orange-600 px-3 py-1 rounded-lg text-[11px] font-bold shadow-sm">${log.items.length} รายการ</div>
                            <div class="flex gap-1"><button onclick="loadHistoryBill(${index})" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px] font-bold hover:bg-blue-700 transition shadow-sm"><i class="fas fa-folder-open mr-1"></i>เปิดดู</button><button onclick="downloadHistoryJSON(${index})" class="bg-gray-800 text-white px-2 py-1 rounded text-[10px] font-bold hover:bg-black transition shadow-sm" title="โหลดไฟล์ JSON"><i class="fas fa-download"></i></button></div></div>
                        </div>`;
            }); html += '</div>'; Swal.fire({ title: '<i class="fas fa-history text-gray-500 mr-2"></i>ประวัติจัดของ', html: html, showConfirmButton: true, confirmButtonText: 'ปิดหน้าต่าง' });
        }
        window.downloadHistoryJSON = function(index) {
            const log = senderHistory[index]; const dataObj = { billId: log.billId, picker: log.picker, timestamp: log.timestamp, items: log.items };
            const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Sender_History_${log.billId}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
        }
    </script>
</body>
</html>
